<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign Up Admin</title><link rel="stylesheet" href="style.css"></head><body class="auth"><main class="authbox"><div class="logo">+</div><small>ADMIN BARU</small><h1>Buat akun admin</h1><p>Isi data di bawah. Akun akan langsung bisa digunakan.</p><form id="signupForm"><label>Nama Admin<input id="name" required placeholder="Nama Admin"></label><label>Email<input id="email" type="email" required placeholder="admin@sekolah.com"></label><label>Password<div class="passbox"><input id="password" type="password" minlength="6" required placeholder="Minimal 6 karakter"><button type="button" id="togglePassword">◉</button></div></label><label>Konfirmasi Password<div class="passbox"><input id="confirm" type="password" required placeholder="Ulangi password"><button type="button" id="toggleConfirm">◉</button></div></label><button class="primary full">Buat Akun Admin</button></form><div id="msg"></div><p class="center">Sudah punya akun? <a href="login.html">Masuk</a></p></main><script src="script.js"></script><script>initSignup()</script></body></html>
